<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f4ed">
<meta name="description" content="Comparte tus recuerdos de la boda de Alan y Rachel.">
<title>Alan & Rachel | Comparte tu recuerdo</title>
<script>document.documentElement.className+=' js'</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,300;0,400;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--verde:#1f3d3a;--verde-suave:#1f3d3a99;--verde-linea:#1f3d3a66;--oro:#b8995a;--fondo:#f7f4ed}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--fondo);color:var(--verde);font-family:"Montserrat",system-ui,sans-serif;font-weight:300}
button{font:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--oro);outline-offset:3px}
a{color:var(--verde)}
.script{font-family:"Great Vibes","Brush Script MT",cursive;font-weight:400;margin:0}
.serif{font-family:"Playfair Display",Georgia,serif;font-weight:400}
.sans{font-family:"Montserrat",system-ui,sans-serif}
.italic{font-style:italic}
.uppercase{text-transform:uppercase}
h1.script{font-size:clamp(54px,15vw,88px);line-height:1.1}
h2.script{font-size:clamp(38px,10vw,52px);line-height:1.15}
.seccion{max-width:620px;margin:0 auto;padding:56px 22px;text-align:center}
.seccion>.serif.italic{font-size:19px;margin:6px 0 20px}
.fecha{font-size:12px;letter-spacing:.3em;color:var(--verde-suave);margin:0}
.gold-line{width:min(220px,60%);height:1px;margin:22px auto;background:linear-gradient(90deg,transparent,var(--oro),transparent)}
.gold-line.small{width:64px;margin:18px auto}
.texto{font-size:16px;line-height:1.75;margin:0 0 26px}
.tarjeta{background:rgba(255,255,255,.9);border-radius:24px;padding:42px 28px;box-shadow:0 20px 40px -12px rgba(31,61,58,.18);backdrop-filter:blur(6px)}
.botones{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:12px 24px;border:1px solid var(--verde);border-radius:999px;background:transparent;color:var(--verde);font:400 12px "Montserrat",sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s}
.btn:hover{background:var(--verde);color:#fff}
.btn.lleno{background:var(--verde);color:#fff}
.btn.lleno:hover{background:#2d544f}
.btn:disabled{opacity:.6;cursor:not-allowed}
.previsualizaciones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:20px}
.miniatura{position:relative;border-radius:12px;overflow:hidden;background:#e9e4d8;aspect-ratio:1}
.miniatura img{display:block;width:100%;height:100%;object-fit:cover}
.quitar{position:absolute;top:5px;right:5px;width:26px;height:26px;border:0;border-radius:50%;background:#fff;color:var(--verde);cursor:pointer;font-weight:bold}
.contador{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--verde-suave);margin:14px 0}
.estado{font-size:15px;line-height:1.6;margin:16px 0 0}
.estado.error{color:#a13931}.estado.ok{color:#2f6b4f}
.ayuda{font-size:11px;line-height:1.7;color:var(--verde-suave);margin:18px 0 0}
.pie{padding:44px 20px 52px;text-align:center}
.pie .script{font-size:34px}
.pie .sans{font-size:11px;letter-spacing:.25em;margin:8px 0 0}
@media(max-width:560px){.botones{flex-direction:column}}
</style>
</head>
<body>
<main>
  <div class="seccion">
    <div class="gold-line"></div>
    <h1 class="script">Alan & Rachel</h1>
    <div class="gold-line"></div>
    <p class="serif italic">“El amor nunca deja de ser.”</p>
    <p class="sans uppercase fecha">24 de octubre de 2026</p>
  </div>

  <section class="seccion" aria-labelledby="titulo-subida">
    <div class="tarjeta">
      <h2 id="titulo-subida" class="script">Comparte tu recuerdo</h2>
      <div class="gold-line small"></div>
      <p class="serif texto">Elige las fotografías que tomaste hoy desde tu dispositivo. ¡Nos encantará ver cada momento!</p>
      
      <form id="upload-form">
        <input type="hidden" name="access_key" value="41e4b4e6-3703-4228-98e1-93e4dd4668db">
        <input type="hidden" name="subject" value="Nuevas fotografías compartidas para la boda de Alan y Rachel">
        <input type="hidden" name="from_name" value="Galería de Boda - Alan & Rachel">
        
        <div class="botones">
          <button class="btn" id="elegir" type="button">Elegir fotografías</button>
        </div>
        
        <input id="archivos" type="file" accept="image/*" multiple hidden>
        
        <div id="previsualizaciones" class="previsualizaciones"></div>
        <p id="contador" class="sans contador"></p>
        
        <button id="subir" class="btn lleno" style="width:100%;margin-top:15px;" type="submit" hidden>Enviar fotografías a los novios</button>
      </form>

      <p id="estado" class="serif estado" role="status"></p>
      <p class="sans ayuda">Máximo 10 fotografías por envío.</p>
    </div>
  </section>
</main>

<footer class="pie">
  <p class="script">A & R</p>
  <p class="sans">24 · 10 · 2026</p>
</footer>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  let selectedFiles = [];

  const pickBtn = $("elegir"), fileInput = $("archivos"), prev = $("previsualizaciones");
  const count = $("contador"), sendBtn = $("subir"), statusEl = $("estado"), form = $("upload-form");

  pickBtn.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", (e) => {
    const files = Array.from(e.target.files);
    for (const f of files) {
      if (!f.type.startsWith("image/")) continue;
      if (selectedFiles.length >= 10) break;
      selectedFiles.push(f);
    }
    fileInput.value = "";
    render();
  });

  function render() {
    prev.replaceChildren();
    selectedFiles.forEach((file, index) => {
      const d = document.createElement("div"); d.className = "miniatura";
      const im = document.createElement("img"); im.src = URL.createObjectURL(file);
      const x = document.createElement("button"); x.type = "button"; x.className = "quitar"; x.textContent = "×";
      x.addEventListener("click", () => {
        selectedFiles.splice(index, 1);
        render();
      });
      d.append(im, x); prev.append(d);
    });
    count.textContent = selectedFiles.length ? `${selectedFiles.length} fotografía(s) seleccionada(s)` : "";
    sendBtn.hidden = !selectedFiles.length;
  }

  // Función para comprimir imágenes antes del envío
  function compressImage(file, maxWidth = 1600, quality = 0.8) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob((blob) => {
            const compressedFile = new File([blob], file.name || "foto.jpg", {
              type: "image/jpeg",
              lastModified: Date.now()
            });
            resolve(compressedFile);
          }, "image/jpeg", quality);
        };
      };
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!selectedFiles.length) return;

    sendBtn.disabled = true;
    pickBtn.disabled = true;
    statusEl.className = "serif estado";

    let successCount = 0;

    for (let i = 0; i < selectedFiles.length; i++) {
      statusEl.textContent = `Optimizando y enviando foto ${i + 1} de ${selectedFiles.length}...`;
      
      try {
        const compressed = await compressImage(selectedFiles[i]);
        const formData = new FormData();
        formData.append("access_key", "41e4b4e6-3703-4228-98e1-93e4dd4668db");
        formData.append("subject", "Fotografía recibida - Boda Alan y Rachel");
        formData.append("attachment", compressed);

        const response = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          body: formData
        });
        const data = await response.json();

        if (data.success) {
          successCount++;
        }
      } catch (err) {
        console.error(err);
      }
    }

    if (successCount > 0) {
      statusEl.textContent = `¡Muchas gracias! Se han enviado ${successCount} fotografía(s) con éxito.`;
      statusEl.className = "serif estado ok";
      selectedFiles = [];
      render();
    } else {
      statusEl.textContent = "No se pudieron enviar las fotos. Revisa tu conexión e inténtalo de nuevo.";
      statusEl.className = "serif estado error";
    }

    sendBtn.disabled = false;
    pickBtn.disabled = false;
  });
})();
</script>
</body>
</html>
